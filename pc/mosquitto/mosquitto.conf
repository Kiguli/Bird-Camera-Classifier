# MQTT broker for the compose network: Frigate publishes events here and the
# enrichment service subscribes. The two load-bearing lines are the explicit
# 0.0.0.0 listener (so other compose containers can reach it - Mosquitto 2.x
# binds localhost-only without it) and allow_anonymous.
#
# Trusted-LAN / homelab config only. Do NOT expose port 1883 to the internet.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
